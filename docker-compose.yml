version: '3.8'

services:
  # ✅ Laravel + FrankenPHP
  laravel_franken:
    container_name: laravel_franken
    image: image_laravel_franken
    build: .
    ports:
      - 8080:80
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - mysql
      - mailpit

  vite:
    image: node:18
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - laravel_franken

  # ✅ MySQL Database
  mysql:
    container_name: mysql_db
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: product_management
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql

  # ✅ Mailpit (Mail testing tool)
  mailpit:
    container_name: mailpit
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - 8025:8025

volumes:
  mysql_data:
