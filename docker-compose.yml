services:
    app:
        build:
            context: .
        container_name: app
        volumes:
            - .:/var/www/product-management
        working_dir: /var/www/product-management
        depends_on:
            - mysql
        links:
            - mysql
        networks:
            - laravel

    nginx:
        image: nginx:stable-alpine
        container_name: laravel_nginx
        ports:
            - 81:80
        volumes:
            - .:/var/www/product-management
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel

    mysql:
        container_name: mysql_db
        image: mysql:8.0
        restart: unless-stopped
        ports:
            - 3307:3306
        environment:
            MYSQL_DATABASE: inventohub_db
            MYSQL_USER: inventohub
            MYSQL_PASSWORD: dockerInvento123!
            MYSQL_ROOT_PASSWORD: Patungandb123_
        networks:
            - laravel
        volumes:
            - ./docker/mysql/my.cnf/:/etc/mysql/conf.d/my.cnf

    mailpit:
        container_name: mailpit
        image: axllent/mailpit
        restart: unless-stopped
        ports:
            - 8025:8025
        networks:
            - laravel

volumes:
    mysql_data:

networks:
    laravel:
        driver: bridge
